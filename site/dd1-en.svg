<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1436 472" width="1436" height="472" role="img">
<rect width="1436" height="472" fill="#ffffff"/>
<rect x="40" y="26" width="236" height="392" rx="16" fill="#eef5fe" stroke="#c3ddf9" stroke-width="1.5"/>
<circle cx="74" cy="62" r="16" fill="#0071e3"/>
<text x="74" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">01</text>
<text x="100" y="68" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="600" fill="#1d1d1f">Your sources</text>
<text x="62" y="100" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">What you already own,</text>
<text x="62" y="121" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">wherever it lives.</text>
<rect x="56" y="146" width="204" height="256" rx="11" fill="#ffffff" stroke="#c3ddf9" stroke-width="1"/>
<text x="70" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0071e3">TYPICALLY</text>
<circle cx="74" cy="189" r="2.6" fill="#0071e3"/>
<text x="84" y="194" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">SQL databases, warehouses</text>
<circle cx="74" cy="210" r="2.6" fill="#0071e3"/>
<text x="84" y="215" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">PDF, Word, slide decks</text>
<circle cx="74" cy="231" r="2.6" fill="#0071e3"/>
<text x="84" y="236" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Intranet, email</text>
<circle cx="74" cy="252" r="2.6" fill="#0071e3"/>
<text x="84" y="257" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Business APIs</text>
<text x="70" y="286" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">Nothing is created here:</text>
<text x="70" y="306" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">you set the scope.</text>
<path d="M283 222.0 L309 222.0" stroke="#0071e3" stroke-width="2.4" fill="none"/><path d="M304 216.0 L313 222.0 L304 228.0 Z" fill="#0071e3"/>
<rect x="320" y="26" width="236" height="392" rx="16" fill="#eef5fe" stroke="#c3ddf9" stroke-width="1.5"/>
<circle cx="354" cy="62" r="16" fill="#0071e3"/>
<text x="354" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">02</text>
<text x="380" y="68" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="600" fill="#1d1d1f">Extraction</text>
<text x="342" y="100" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">The file becomes clean,</text>
<text x="342" y="121" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">uniform text.</text>
<rect x="336" y="146" width="204" height="256" rx="11" fill="#ffffff" stroke="#c3ddf9" stroke-width="1"/>
<text x="350" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0071e3">WHAT IS STRIPPED</text>
<circle cx="354" cy="189" r="2.6" fill="#0071e3"/>
<text x="364" y="194" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Layout, headers</text>
<circle cx="354" cy="210" r="2.6" fill="#0071e3"/>
<text x="364" y="215" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Repeated footers</text>
<circle cx="354" cy="231" r="2.6" fill="#0071e3"/>
<text x="364" y="236" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Broken tables</text>
<text x="350" y="265" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0071e3">THE TRAP</text>
<text x="350" y="287" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">A scanned PDF with no</text>
<text x="350" y="307" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">character recognition</text>
<text x="350" y="327" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">yields nothing at all.</text>
<path d="M563 222.0 L589 222.0" stroke="#0071e3" stroke-width="2.4" fill="none"/><path d="M584 216.0 L593 222.0 L584 228.0 Z" fill="#0071e3"/>
<rect x="600" y="26" width="236" height="392" rx="16" fill="#eef5fe" stroke="#c3ddf9" stroke-width="1.5"/>
<circle cx="634" cy="62" r="16" fill="#0071e3"/>
<text x="634" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">03</text>
<text x="660" y="68" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="600" fill="#1d1d1f">Chunking</text>
<text x="622" y="100" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">The text is cut into</text>
<text x="622" y="121" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">workable pieces.</text>
<rect x="616" y="146" width="204" height="256" rx="11" fill="#ffffff" stroke="#c3ddf9" stroke-width="1"/>
<text x="630" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0071e3">THREE STRATEGIES</text>
<circle cx="634" cy="189" r="2.6" fill="#0071e3"/>
<text x="644" y="194" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">By fixed length</text>
<circle cx="634" cy="210" r="2.6" fill="#0071e3"/>
<text x="644" y="215" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">By structure (headings)</text>
<circle cx="634" cy="231" r="2.6" fill="#0071e3"/>
<text x="644" y="236" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">By sentence</text>
<text x="630" y="265" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0071e3">OVERLAP</text>
<text x="630" y="291" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="700" fill="#0071e3">≈ 20 tokens</text>
<text x="630" y="315" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">between two chunks, so an</text>
<text x="630" y="335" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">idea is not cut in half.</text>
<path d="M843 222.0 L869 222.0" stroke="#0071e3" stroke-width="2.4" fill="none"/><path d="M864 216.0 L873 222.0 L864 228.0 Z" fill="#0071e3"/>
<rect x="880" y="26" width="236" height="392" rx="16" fill="#eef5fe" stroke="#c3ddf9" stroke-width="1.5"/>
<circle cx="914" cy="62" r="16" fill="#0071e3"/>
<text x="914" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">04</text>
<text x="940" y="68" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="600" fill="#1d1d1f">Embedding</text>
<text x="902" y="100" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">Each chunk becomes</text>
<text x="902" y="121" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">a list of numbers.</text>
<rect x="896" y="146" width="204" height="256" rx="11" fill="#ffffff" stroke="#c3ddf9" stroke-width="1"/>
<text x="910" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0071e3">THE MODEL</text>
<text x="910" y="194" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">A dedicated model, not</text>
<text x="910" y="214" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">the one that writes.</text>
<text x="910" y="242" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0071e3">DIMENSIONS</text>
<text x="910" y="268" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="700" fill="#0071e3">768</text>
<text x="910" y="292" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">Changing model forces a</text>
<text x="910" y="312" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">full re-index.</text>
<path d="M1123 222.0 L1149 222.0" stroke="#0071e3" stroke-width="2.4" fill="none"/><path d="M1144 216.0 L1153 222.0 L1144 228.0 Z" fill="#0071e3"/>
<rect x="1160" y="26" width="236" height="392" rx="16" fill="#eef5fe" stroke="#c3ddf9" stroke-width="1.5"/>
<circle cx="1194" cy="62" r="16" fill="#0071e3"/>
<text x="1194" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">05</text>
<text x="1220" y="68" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="600" fill="#1d1d1f">Index</text>
<text x="1182" y="100" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">Vectors are stored so they</text>
<text x="1182" y="121" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">can be found fast.</text>
<rect x="1176" y="146" width="204" height="256" rx="11" fill="#ffffff" stroke="#c3ddf9" stroke-width="1"/>
<text x="1190" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0071e3">WHAT IS STORED</text>
<circle cx="1194" cy="189" r="2.6" fill="#0071e3"/>
<text x="1204" y="194" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">The vector</text>
<circle cx="1194" cy="210" r="2.6" fill="#0071e3"/>
<text x="1204" y="215" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">The chunk text</text>
<circle cx="1194" cy="231" r="2.6" fill="#0071e3"/>
<text x="1204" y="236" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Source, date, rights</text>
<text x="1190" y="265" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0071e3">THE SEARCH</text>
<text x="1190" y="287" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">Nearest neighbours,</text>
<text x="1190" y="307" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">without comparing all.</text>
<text x="718.0" y="454" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14" fill="#5f6368">Steps 01 to 05 · this pipeline runs once, offline, and runs again whenever the documents change.</text>
</svg>