<text x="644" y="257" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Latency, errors</text>
<text x="630" y="286" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7c4dc8">WITHOUT MEASUREMENT</text>
<text x="630" y="308" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">No steering, no</text>
