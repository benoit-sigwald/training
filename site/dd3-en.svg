<text x="100" y="68" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="600" fill="#1d1d1f">Tools &amp; actions</text>
<text x="62" y="100" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">The system acts, it does</text>
