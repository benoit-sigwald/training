<text x="70" y="262" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7c4dc8">WHAT THE EXECUTOR HOLDS</text>
