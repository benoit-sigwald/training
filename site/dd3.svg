<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 876 504" width="876" height="504" role="img">
<rect width="876" height="504" fill="#ffffff"/>
<rect x="40" y="26" width="236" height="392" rx="16" fill="#f4eefc" stroke="#dcc9f2" stroke-width="1.5"/>
<circle cx="74" cy="62" r="16" fill="#7c4dc8"/>
<text x="74" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">11</text>
<text x="100" y="68" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="600" fill="#1d1d1f">Outils &amp; actions</text>
<text x="62" y="100" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">Le système agit, il ne fait</text>
<text x="62" y="121" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">pas que répondre.</text>
<rect x="56" y="146" width="204" height="256" rx="11" fill="#ffffff" stroke="#dcc9f2" stroke-width="1"/>
<text x="70" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7c4dc8">LE MÉCANISME</text>
<text x="70" y="194" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">Le modèle n'exécute rien :</text>
<text x="70" y="214" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">il demande. Un exécuteur,</text>
<text x="70" y="234" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">en dehors de lui, agit.</text>
<text x="70" y="262" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7c4dc8">CE QUE PORTE L'EXÉCUTEUR</text>
<circle cx="74" cy="279" r="2.6" fill="#7c4dc8"/>
<text x="84" y="284" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Le registre des outils</text>
<circle cx="74" cy="300" r="2.6" fill="#7c4dc8"/>
<text x="84" y="305" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">L'authentification</text>
<circle cx="74" cy="321" r="2.6" fill="#7c4dc8"/>
<text x="84" y="326" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Les quotas et les droits</text>
<path d="M283 222.0 L309 222.0" stroke="#7c4dc8" stroke-width="2.4" fill="none"/><path d="M304 216.0 L313 222.0 L304 228.0 Z" fill="#7c4dc8"/>
<rect x="320" y="26" width="236" height="392" rx="16" fill="#f4eefc" stroke="#dcc9f2" stroke-width="1.5"/>
<circle cx="354" cy="62" r="16" fill="#7c4dc8"/>
<text x="354" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">12</text>
<text x="380" y="68" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="600" fill="#1d1d1f">Vérification humaine</text>
<text x="342" y="100" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">Un humain là où l'erreur</text>
<text x="342" y="121" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">coûte cher.</text>
<rect x="336" y="146" width="204" height="256" rx="11" fill="#ffffff" stroke="#dcc9f2" stroke-width="1"/>
<text x="350" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7c4dc8">LES LEVIERS</text>
<circle cx="354" cy="189" r="2.6" fill="#7c4dc8"/>
<text x="364" y="194" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Seuil de confiance</text>
<circle cx="354" cy="210" r="2.6" fill="#7c4dc8"/>
<text x="364" y="215" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">File de relecture</text>
<circle cx="354" cy="231" r="2.6" fill="#7c4dc8"/>
<text x="364" y="236" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Échantillonnage</text>
<text x="350" y="265" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7c4dc8">L'ESSENTIEL</text>
<text x="350" y="287" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">La correction remonte vers</text>
<text x="350" y="307" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">l'index et les filtres —</text>
<text x="350" y="327" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">sinon l'erreur revient.</text>
<path d="M563 222.0 L589 222.0" stroke="#7c4dc8" stroke-width="2.4" fill="none"/><path d="M584 216.0 L593 222.0 L584 228.0 Z" fill="#7c4dc8"/>
<rect x="600" y="26" width="236" height="392" rx="16" fill="#f4eefc" stroke="#dcc9f2" stroke-width="1.5"/>
<circle cx="634" cy="62" r="16" fill="#7c4dc8"/>
<text x="634" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">13</text>
<text x="660" y="68" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="600" fill="#1d1d1f">Journal &amp; coûts</text>
<text x="622" y="100" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">Ce qui s'est passé, ce que</text>
<text x="622" y="121" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#5f6368">ça a coûté, et la preuve.</text>
<rect x="616" y="146" width="204" height="256" rx="11" fill="#ffffff" stroke="#dcc9f2" stroke-width="1"/>
<text x="630" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7c4dc8">UNE TRACE PAR ÉCHANGE</text>
<circle cx="634" cy="189" r="2.6" fill="#7c4dc8"/>
<text x="644" y="194" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Qui a demandé quoi</text>
<circle cx="634" cy="210" r="2.6" fill="#7c4dc8"/>
<text x="644" y="215" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Documents remontés</text>
<circle cx="634" cy="231" r="2.6" fill="#7c4dc8"/>
<text x="644" y="236" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Jetons et coût</text>
<circle cx="634" cy="252" r="2.6" fill="#7c4dc8"/>
<text x="644" y="257" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#1d1d1f">Latence, erreurs</text>
<text x="630" y="286" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7c4dc8">SANS MESURE</text>
<text x="630" y="308" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">Pas de pilotage, pas</text>
<text x="630" y="328" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" fill="#5f6368">d'explication, pas de preuve.</text>
<path d="M796 342.0 L796 448 L80 448 L80 342.0" stroke="#7c4dc8" stroke-width="2" stroke-dasharray="7 6" fill="none" opacity=".75"/>
<path d="M74 348.0 L80 338.0 L86 348.0 Z" fill="#7c4dc8" opacity=".75"/>
<text x="438.0" y="486" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif" font-size="14" fill="#5f6368">Étapes 11 à 13 · ce qui encadre l'exécution. Le trait discontinu est la boucle de retour vers l'index.</text>
</svg>